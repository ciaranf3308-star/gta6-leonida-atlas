name: CI

on:
  push:
    branches:
      - main
      - spoiler-free-pwa
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_ANALYTICS_ID: ""
      # The base the app actually ships under. The preview server
      # (`pnpm start`) and the live Pages site both serve it here, so
      # the build must bake the same base into its asset URLs — CI
      # previously built with '/', the preview served
      # /gta6-leonida-atlas/, every JS chunk 404'd, React never
      # mounted, and all 23 browser tests failed at open.
      ATLAS_BASE_PATH: "/gta6-leonida-atlas/"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Activate pnpm
        # Pinned to the version in package.json `packageManager` — the
        # lockfile was generated with it. Do not drift this silently.
        run: corepack enable && corepack prepare pnpm@12.18.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      # Suite-flake mitigation (v0.30.0): the atlas-security tests shell
      # out to finalize-build.mjs, which spins up a Vite SSR server.
      # On a loaded box that took longer than the old 30 s exec
      # timeout and flaked as spawnSync ETIMEDOUT. The helper now
      # allows 120 s; CI runners have 4 vCPUs, so the suite runs at
      # default parallelism. If this flakes again, look at the
      # finalize timeout first — do not silence the failure.
      - name: Run unit tests
        run: pnpm test:unit
      - name: Build
        run: pnpm build
      - name: Install tile grade dependencies
        run: python3 -m pip install --user numpy pillow
      - name: Tile grade smoke test
        # Proves the tile pipeline runs in CI (sample render from the
        # tracked day tiles). No elevation grid in CI, so the sample
        # grades without hill-shading — the warning is expected. The
        # full pyramid render lives in tiles.yml.
        run: env -u PYTHONNOUSERSITE python3 scripts/grade-tiles.py --sample
      - name: Install browser test engines
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run browser tests
        # Playwright's auto webServer is disabled when E2E_BASE_URL is
        # set (see playwright.config.ts), so start the preview here
        # and point the tests at the base it serves — the same base
        # the build above baked into the asset URLs.
        run: |
          pnpm start > /tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            if curl -fsSL http://127.0.0.1:4330/gta6-leonida-atlas/ > /dev/null 2>&1; then break; fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:4330/gta6-leonida-atlas/ pnpm test:e2e
          TEST_EXIT=$?
          kill $PREVIEW_PID 2>/dev/null || true
          exit $TEST_EXIT
