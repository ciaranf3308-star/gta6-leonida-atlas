name: Publish Atlas release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: atlas-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_ANALYTICS_ID: ''
      # Same base alignment as ci.yml: the build must bake the base
      # the preview serves (/gta6-leonida-atlas/), or every JS chunk
      # 404s and the browser tests fail at open.
      ATLAS_BASE_PATH: '/gta6-leonida-atlas/'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Activate pnpm
        run: corepack enable && corepack prepare pnpm@12.18.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      # The graded tile pyramid is generated, not tracked (gitignored),
      # so a fresh checkout has NO tiles and the browser tests fail
      # waiting on one that can never load. Render the full pyramid
      # before the build (Vite copies public/ into dist/). No elevation
      # grid in CI, so this grades without hill-shading — expected.
      # Same commands as scripts/build-from-clean.sh.
      - run: python3 -m pip install --user numpy pillow
      - name: Render graded tile pyramid
        run: |
          env -u PYTHONNOUSERSITE python3 scripts/grade-tiles.py --full --workers 4
          env -u PYTHONNOUSERSITE python3 scripts/grade-tiles.py --fill-ocean
          env -u PYTHONNOUSERSITE python3 scripts/grade-tiles.py --check
      - run: pnpm build
      - name: Install browser test engines
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run browser tests
        # Playwright's auto webServer is disabled when E2E_BASE_URL is
        # set (see playwright.config.ts), so start the preview here
        # and point the tests at the base it serves.
        run: |
          pnpm start > /tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            if curl -fsSL http://127.0.0.1:4330/gta6-leonida-atlas/ > /dev/null 2>&1; then break; fi
            sleep 1
          done
          E2E_BASE_URL=http://127.0.0.1:4330/gta6-leonida-atlas/ pnpm test:e2e
          TEST_EXIT=$?
          kill $PREVIEW_PID 2>/dev/null || true
          exit $TEST_EXIT

  publish:
    needs: validate
    if: github.repository == 'ciaranf3308-star/gta6-leonida-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Backfill tagged releases and publish the current version as latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs
