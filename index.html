<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1018" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ViceWire" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <meta name="description" content="Explore Leonida. An independent, approximate community atlas with local favorites, notes, collections and a map editor. No account required." />
    <!-- v0.29.0: the 2.8 MB place catalogue is fetched after the JS
         bundle parses and React mounts; preloading it lets the
         browser start it with the HTML parse instead, so the
         catalogue is usually already there when the app asks for it.
         Same URL the app fetches (src/data/catalogue.ts) or the
         preload is wasted; on repeat visits the service worker
         serves it from cache either way. -->
    <link rel="preload" href="%BASE_URL%assets/street-leonida/maps/gtadb-landmarks-d406fea.json" as="fetch" crossorigin="anonymous" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>ViceWire — GTA VI Leonida Map</title>
  </head>
  <body><div id="root"></div><noscript>ViceWire needs JavaScript to display the interactive map. Public map attribution: GTADB / Map GTA contributors, CC BY 4.0.</noscript><script type="module" src="/src/main.tsx"></script></body>
</html>
